[package]
name = "selection-harness"
version = "0.0.0"
edition = "2021"
publish = false
description = "Native regression driver for QuickTranslate's selection capture"

# Standalone on purpose: it is not part of the application build or its CI.
[workspace]

[dependencies]
# Must match the application's `windows` version; the capture sources are compiled in.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 1
